<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RExchange - Campus Community Exchange</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>RExchange</h1>
      <p class="tagline">Campus community exchange for items, skills, and opportunities</p>
    </header>

    <main>
      <!-- Listing Form Section -->
      <section class="form-section">
        <h2>Post a Listing</h2>
        <div id="error-message" class="error-message" style="display: none;" role="alert"></div>
        <form id="listing-form" novalidate>
          <div class="form-group">
            <label for="title">Title <span class="required">*</span></label>
            <input type="text" id="title" name="title" placeholder="e.g. Calculus Textbook, Guitar Lessons, Hackathon Teammate" required>
          </div>

          <div class="form-group">
            <label for="category">Category <span class="required">*</span></label>
            <select id="category" name="category" required>
              <option value="">-- Select Category --</option>
              <option value="Item">Item</option>
              <option value="Skill">Skill</option>
              <option value="Opportunity">Opportunity</option>
            </select>
          </div>

          <div class="form-group">
            <label for="description">Description <span class="required">*</span></label>
            <textarea id="description" name="description" rows="4" placeholder="Describe what you want to exchange, offer, or are looking for..." required></textarea>
          </div>

          <div class="form-group">
            <label for="contact">Contact Info <span class="required">*</span></label>
            <input type="text" id="contact" name="contact" placeholder="e.g. student@university.edu / @discord_handle / phone" required>
          </div>

          <button type="submit" id="submit-btn" class="btn-primary">Post Listing</button>
        </form>
      </section>

      <!-- Listings Feed Section -->
      <section class="feed-section">
        <h2>Exchange Feed</h2>
        <div id="empty-state" class="empty-state">
          <p>No listings yet. Post the first listing above!</p>
        </div>
        <div id="listings-feed" class="listings-feed"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
